  <!-- Apply the saved theme before React loads, so dark mode doesn't flash white -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("eternal-settings") || "{}");
      var t = s.theme || "light";
      document.documentElement.dataset.theme = t;
      if (s.fontScale) document.documentElement.style.fontSize = s.fontScale * 100 + "%";
    } catch (e) {}
  </script>
